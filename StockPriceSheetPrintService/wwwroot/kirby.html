<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portefølje Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
    <style>
        /* ---- Jyske Bank brand palette (omjyskebank.dk/brand/kommunikation/designguide/farver) ---- */
        /* applied through Kirby-inspired component shapes (https://cookbook.kirby.design)           */
        :root {
            --jyske-primary: #005c3c;
            --jyske-dark: #01352c;
            --jyske-mid: #136a58;
            --jyske-accent: #00a976;
            --jyske-bright: #20c598;
            --jyske-negative: #8e1a33;

            --page-bg: #f4f6f5;
            --surface: #ffffff;
            --surface-border: #e1e7e4;
            --divider: #e1e7e4;

            --text-primary: #142420;
            --text-secondary: #5c6b66;
            --text-muted: #7c8a85;

            --chip-bg: #eef2f0;
            --chip-bg-hover: #e3e9e6;

            --radius-pill: 999px;
            --radius-n: 16px;
            --radius-s: 8px;

            --elevation-card: 0 1px 2px rgba(20, 36, 32, 0.04), 0 8px 20px -12px rgba(20, 36, 32, 0.08);
            --elevation-popover: 0 0 5px 0 rgba(20, 36, 32, 0.04), 0 10px 15px -10px rgba(20, 36, 32, 0.18);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--page-bg);
            color: var(--text-primary);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        .topbar {
            background: var(--page-bg);
            padding: 1.5rem 2rem;
        }

        .eyebrow {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--jyske-mid);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.35rem;
        }

        .topbar h1 {
            font-size: 1.75rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .page-content {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kirby-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-n);
            box-shadow: var(--elevation-card);
        }

        .stat-card {
            padding: 1.25rem 1.5rem;
        }

            .stat-card .label {
                font-size: 0.75rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            .stat-card .value {
                font-size: 1.6rem;
                font-weight: 700;
                color: var(--text-primary);
                font-feature-settings: "tnum";
            }

            .stat-card .sub {
                font-size: 0.85rem;
                margin-top: 0.3rem;
                font-weight: 500;
            }

        .positive {
            color: var(--jyske-mid);
        }

        .negative {
            color: var(--jyske-negative);
        }

        .neutral {
            color: var(--text-secondary);
        }

        .chart-container {
            padding: 1.5rem;
        }

        /* ---- Kirby "chip mode" segmented control ---- */
        .period-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }

            .period-buttons button {
                background: var(--chip-bg);
                border: none;
                color: var(--text-secondary);
                border-radius: var(--radius-pill);
                padding: 0.4rem 0.95rem;
                font-family: inherit;
                font-size: 0.8rem;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.15s ease, color 0.15s ease;
            }

                .period-buttons button:hover {
                    background: var(--chip-bg-hover);
                }

                .period-buttons button.active {
                    background: var(--jyske-primary);
                    color: #ffffff;
                    font-weight: 700;
                }

                .period-buttons button.active:hover {
                    background: var(--jyske-dark);
                }

        canvas {
            width: 100% !important;
        }

        #error {
            display: none;
            color: var(--jyske-negative);
            background: rgba(142, 26, 51, 0.08);
            border-left: 3px solid var(--jyske-negative);
            border-radius: var(--radius-s);
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ---- Kirby Badge ---- */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.7rem;
            border-radius: var(--radius-pill);
            background: rgba(0, 92, 60, 0.08);
            color: var(--jyske-primary);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .chart-toolbar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }

        /* ---- Kirby Dropdown (button + popover listbox, mirrors kirby-dropdown/kirby-popover/kirby-item) ---- */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .kirby-dropdown {
            position: relative;
            display: inline-block;
        }

        .kirby-dropdown-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            background: var(--chip-bg);
            border: none;
            color: var(--text-primary);
            border-radius: var(--radius-pill);
            padding: 0.4rem 0.85rem;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

            .kirby-dropdown-trigger:hover {
                background: var(--chip-bg-hover);
            }

            .kirby-dropdown-trigger .kirby-dropdown-arrow {
                flex-shrink: 0;
                color: var(--text-muted);
                transition: transform 0.15s ease;
            }

        .kirby-dropdown.open .kirby-dropdown-trigger {
            box-shadow: var(--elevation-popover);
        }

        .kirby-dropdown.open .kirby-dropdown-arrow {
            transform: rotate(180deg);
        }

        .kirby-dropdown-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 100%;
            width: max-content;
            max-height: 352px;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-n);
            box-shadow: var(--elevation-popover);
            z-index: 20;
        }

            .kirby-dropdown-panel[hidden] {
                display: none;
            }

        .kirby-dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.1s ease;
        }

            .kirby-dropdown-item:not(:last-child) {
                border-bottom: 1px solid var(--divider);
            }

            .kirby-dropdown-item:hover {
                background: var(--page-bg);
            }

            .kirby-dropdown-item.selected {
                color: var(--jyske-primary);
                font-weight: 700;
            }

            .kirby-dropdown-item .check {
                color: var(--jyske-accent);
                font-weight: 700;
            }

        /* ---- Kirby Button (attention-level3 default / attention-level1 active) ---- */
        .toggle-btn {
            background: var(--chip-bg);
            border: none;
            color: var(--text-secondary);
            border-radius: var(--radius-pill);
            padding: 0.4rem 0.95rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

            .toggle-btn:hover {
                background: var(--chip-bg-hover);
            }

            .toggle-btn.active {
                background: var(--jyske-accent);
                color: #ffffff;
                font-weight: 700;
            }

            .toggle-btn.active:hover {
                background: var(--jyske-mid);
            }

        @media (max-width: 600px) {
            .topbar {
                padding: 1.1rem 1rem;
            }

            .topbar h1 {
                font-size: 1.3rem;
            }

            .page-content {
                padding: 1rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }

            .stat-card {
                padding: 0.9rem 1rem;
            }

                .stat-card .value {
                    font-size: 1.15rem;
                }

                .stat-card .sub {
                    font-size: 0.75rem;
                }

            .chart-container {
                padding: 1rem;
            }

            .period-buttons button {
                padding: 0.6rem 0.75rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="eyebrow">Saxo · Nordnet · June</p>
        <h1>Portfolio Dashboard</h1>
    </div>

    <div class="page-content">
        <div class="stats" id="statsRow1">
            <div class="stat-card kirby-card">
                <div class="label">Latest total</div>
                <div class="value" id="latestValue">—</div>
                <div class="sub neutral" id="latestDate">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">Change (1 day)</div>
                <div class="value" id="dayChange">—</div>
                <div class="sub" id="dayChangePct">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">YTD change</div>
                <div class="value" id="ytdChange">—</div>
                <div class="sub" id="ytdChangePct">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">Total data points</div>
                <div class="value" id="dataPoints">—</div>
                <div class="sub neutral" id="dataRange">—</div>
            </div>
        </div>

        <div class="stats" id="statsRow2">
            <div class="stat-card kirby-card">
                <div class="label">Change in the period</div>
                <div class="value" id="periodChange">—</div>
                <div class="sub" id="periodChangePct">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">Data points in the period</div>
                <div class="value" id="periodPoints">—</div>
                <div class="sub neutral" id="periodPointsSub">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">Best day in the period</div>
                <div class="value" id="bestDayValue">—</div>
                <div class="sub neutral" id="bestDayDate">—</div>
            </div>
            <div class="stat-card kirby-card">
                <div class="label">Volatility (std. dev.)</div>
                <div class="value" id="volatility">—</div>
                <div class="sub neutral" id="volatilitySub">—</div>
            </div>
        </div>

        <div class="chart-container kirby-card">
            <div class="period-buttons">
                <button data-days="7">1W</button>
                <button data-days="30">1M</button>
                <button data-days="90">3M</button>
                <button data-days="180">6M</button>
                <button data-days="365">1Y</button>
                <button data-days="ytd">YTD</button>
                <button data-days="0" class="active">All history</button>
            </div>
            <div class="chart-toolbar">
                <div class="toolbar-group">
                    <label class="toolbar-label" for="benchmarkDropdownBtn">Benchmark</label>
                    <div class="kirby-dropdown" id="benchmarkDropdown">
                        <button type="button" class="kirby-dropdown-trigger" id="benchmarkDropdownBtn"
                                role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="benchmarkListbox">
                            <span class="text" id="benchmarkDropdownText"></span>
                            <svg class="kirby-dropdown-arrow" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
                                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="kirby-dropdown-panel" id="benchmarkListbox" role="listbox" aria-labelledby="benchmarkDropdownBtn" hidden></div>
                        <select id="benchmarkSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
                            <option value="msci">MSCI World (~10% p.a.)</option>
                            <option value="sp500">S&P 500 (~11% p.a.)</option>
                            <option value="omxc25">OMXC25 (~8% p.a.)</option>
                            <option value="inflation">Inflation (~2,5% p.a.)</option>
                            <option value="bonds">Obligationer (~3% p.a.)</option>
                        </select>
                    </div>
                    <button class="toggle-btn" id="benchmarkToggle">Fra</button>
                </div>
                <div class="toolbar-group">
                    <span class="toolbar-label">Trendlinje</span>
                    <button class="toggle-btn" id="trendToggle">Fra</button>
                </div>
                <span class="badge" id="periodBadge">All history</span>
            </div>
            <canvas id="chart"></canvas>
        </div>

        <p id="error"></p>
    </div>

    <script>
        const fmt = new Intl.NumberFormat("da-DK", { style: "currency", currency: "DKK", maximumFractionDigits: 0 });
        const fmtPct = v => (v >= 0 ? "+" : "") + v.toFixed(2) + " %";
        const fmtAxis = v => {
            if (Math.abs(v) >= 1e6) return (v / 1e6).toLocaleString("da-DK", { maximumFractionDigits: 1 }) + "M";
            if (Math.abs(v) >= 1e3) return (v / 1e3).toLocaleString("da-DK", { maximumFractionDigits: 0 }) + "k";
            return v.toString();
        };

        function colorClass(v) { return v > 0 ? "positive" : v < 0 ? "negative" : "neutral"; }

        function setText(id, text, cls) {
            const el = document.getElementById(id);
            el.textContent = text;
            if (cls) { el.className = "sub " + cls; }
        }

        let allEntries = [];
        let currentDays = 0;
        let chart = null;

        const crosshairPlugin = {
            id: 'crosshair',
            afterDraw(chart) {
                if (chart._hoverY == null) return;
                const { ctx, chartArea } = chart;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(chartArea.left, chart._hoverY);
                ctx.lineTo(chartArea.right, chart._hoverY);
                ctx.strokeStyle = 'rgba(20,36,32,0.25)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            }
        };

        const benchmarkRates = {
            msci: 0.10,
            sp500: 0.11,
            omxc25: 0.08,
            inflation: 0.025,
            bonds: 0.03,
        };

        let showBenchmark = false;
        let showTrend = false;

        function generateBenchmark(entries, annualRate) {
            if (entries.length === 0) return [];
            const base = entries[0].value;
            const startDate = new Date(entries[0].date);
            return entries.map(e => {
                const days = (new Date(e.date) - startDate) / (1000 * 60 * 60 * 24);
                return base * Math.pow(1 + annualRate, days / 365);
            });
        }

        function generateTrend(entries) {
            const n = entries.length;
            if (n < 2) return [];
            const xs = entries.map((_, i) => i);
            const ys = entries.map(e => e.value);
            const meanX = (n - 1) / 2;
            const meanY = ys.reduce((a, b) => a + b, 0) / n;
            const num = xs.reduce((sum, x, i) => sum + (x - meanX) * (ys[i] - meanY), 0);
            const den = xs.reduce((sum, x) => sum + Math.pow(x - meanX, 2), 0);
            const slope = num / den;
            const intercept = meanY - slope * meanX;
            return xs.map(x => Math.round(slope * x + intercept));
        }

        function buildChart(entries) {
            const labels = entries.map(e => e.date);
            const values = entries.map(e => e.value);
            const benchmarkKey = document.getElementById("benchmarkSelect").value;
            const benchmarkData = benchmarkKey !== "none"
                ? generateBenchmark(entries, benchmarkRates[benchmarkKey])
                : [];
            const trendData = generateTrend(entries);

            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.data.datasets[1].data = showBenchmark && benchmarkData.length ? benchmarkData : [];
                chart.data.datasets[2].data = showTrend ? trendData : [];
                chart.update();
                return;
            }

            const ctx = document.getElementById("chart").getContext("2d");
            const g = ctx.createLinearGradient(0, 0, 0, 400);
            g.addColorStop(0, "rgba(0,169,118,0.2)");
            g.addColorStop(1, "rgba(0,169,118,0)");

            chart = new Chart(ctx, {
                plugins: [crosshairPlugin],
                type: "line",
                data: {
                    labels,
                    datasets: [
                        {
                            label: "Portefølje",
                            data: values,
                            borderColor: "#00a976",
                            backgroundColor: g,
                            borderWidth: 2,
                            pointRadius: entries.length > 100 ? 0 : 3,
                            pointHoverRadius: 5,
                            fill: true,
                            tension: 0.3,
                            order: 1,
                        },
                        {
                            label: "Benchmark",
                            data: showBenchmark && benchmarkData.length ? benchmarkData : [],
                            borderColor: "#c68a00",
                            backgroundColor: "transparent",
                            borderWidth: 1.5,
                            borderDash: [5, 4],
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            fill: false,
                            tension: 0.3,
                            order: 2,
                        },
                        {
                            label: "Trend",
                            data: showTrend ? trendData : [],
                            borderColor: "rgba(142,26,51,0.7)",
                            backgroundColor: "transparent",
                            borderWidth: 1.5,
                            borderDash: [3, 3],
                            pointRadius: 0,
                            pointHoverRadius: 0,
                            fill: false,
                            tension: 0,
                            order: 3,
                        },
                    ]
                },
                options: {
                    onHover(evt, items, chart) {
                        if (!items.length) {
                            chart._hoverY = null;
                        } else {
                            chart._hoverY = chart.scales.y.getPixelForValue(items[0].element.$context.raw);
                        }
                    },
                    responsive: true,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.dataset.label}: ${fmt.format(ctx.parsed.y)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#5c6b66", maxTicksLimit: 8 },
                            grid: { color: "#eef2f0" }
                        },
                        y: {
                            ticks: {
                                color: "#5c6b66",
                                callback: v => fmtAxis(v)
                            },
                            grid: { color: "#eef2f0" }
                        }
                    }
                }
            });

            document.getElementById("chart").addEventListener("mouseleave", () => {
                chart._hoverY = null;
                chart.update("none");
            });
        }

        function populatePeriodStats(entries, periodLabel) {
            if (entries.length === 0) return;

            document.getElementById("periodBadge").textContent = periodLabel;

            const first = entries[0];
            const last = entries[entries.length - 1];

            // Ændring i perioden
            const diff = last.value - first.value;
            const pct = (diff / first.value) * 100;
            document.getElementById("periodChange").textContent = fmt.format(diff);
            document.getElementById("periodChange").className = "value " + colorClass(diff);
            const pctEl = document.getElementById("periodChangePct");
            pctEl.textContent = fmtPct(pct);
            pctEl.className = "sub " + colorClass(pct);

            // Datapunkter i periode
            document.getElementById("periodPoints").textContent = entries.length;
            document.getElementById("periodPointsSub").textContent =
                `af ${allEntries.length} total · ${periodLabel}`;

            // Bedste dag
            let bestDiff = -Infinity;
            let bestDate = "—";
            for (let i = 1; i < entries.length; i++) {
                const d = entries[i].value - entries[i - 1].value;
                if (d > bestDiff) {
                    bestDiff = d;
                    bestDate = entries[i].date;
                }
            }
            document.getElementById("bestDayValue").textContent =
                bestDiff > -Infinity ? fmt.format(bestDiff) : "—";
            document.getElementById("bestDayValue").className =
                "value " + colorClass(bestDiff);
            document.getElementById("bestDayDate").textContent = bestDate;

            // Volatilitet — standardafvigelse på daglige ændringer
            const dailyChanges = [];
            for (let i = 1; i < entries.length; i++) {
                dailyChanges.push(entries[i].value - entries[i - 1].value);
            }
            if (dailyChanges.length > 1) {
                const mean = dailyChanges.reduce((a, b) => a + b, 0) / dailyChanges.length;
                const variance = dailyChanges.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / dailyChanges.length;
                const stdDev = Math.sqrt(variance);
                document.getElementById("volatility").textContent = "±" + fmt.format(Math.round(stdDev));
                document.getElementById("volatilitySub").textContent = "per day in the period";
            } else {
                document.getElementById("volatility").textContent = "—";
                document.getElementById("volatilitySub").textContent = "not enough data";
            }
        }

        function filterAndRender(days) {
            currentDays = days;
            let entries = allEntries;
            let periodLabel = "All history";

            if (days === "ytd") {
                const ytdStart = `${new Date().getFullYear()}-01-01`;
                entries = allEntries.filter(e => e.date >= ytdStart);
                periodLabel = "Year to date";
            } else if (days > 0) {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - days);
                const cutoffStr = cutoff.toISOString().slice(0, 10);
                entries = allEntries.filter(e => e.date >= cutoffStr);
                const labels = { 7: "1 Week", 30: "1 Month", 90: "3 Months", 180: "6 Months", 365: "1 Year" };
                periodLabel = labels[days] ?? `${days}d`;
            }

            buildChart(entries);
            populatePeriodStats(entries, periodLabel);
        }


        function populateStats(entries) {
            if (entries.length === 0) return;

            const latest = entries[entries.length - 1];
            const prev = entries.length >= 2 ? entries[entries.length - 2] : null;

            setText("latestValue", fmt.format(latest.value));
            setText("latestDate", latest.date, "neutral");

            if (prev) {
                const diff = latest.value - prev.value;
                const pct = (diff / prev.value) * 100;
                document.getElementById("dayChange").textContent = fmt.format(diff);
                document.getElementById("dayChange").className = "value " + colorClass(diff);
                setText("dayChangePct", fmtPct(pct), colorClass(pct));
            }

            const now = new Date();
            const ytdStart = `${now.getFullYear()}-01-01`;
            const firstOfYear = entries.find(e => e.date >= ytdStart);
            if (firstOfYear) {
                const ytdDiff = latest.value - firstOfYear.value;
                const ytdPct = (ytdDiff / firstOfYear.value) * 100;
                document.getElementById("ytdChange").textContent = fmt.format(ytdDiff);
                document.getElementById("ytdChange").className = "value " + colorClass(ytdDiff);
                setText("ytdChangePct", fmtPct(ytdPct), colorClass(ytdPct));
            }

            setText("dataPoints", entries.length.toString());
            setText("dataRange", entries[0].date + " → " + latest.date, "neutral");
        }

        async function init() {
            try {
                const res = await fetch("/dashboard/data");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allEntries = await res.json();
                populateStats(allEntries);
                filterAndRender(0);
            } catch (e) {
                const el = document.getElementById("error");
                el.textContent = "Kunne ikke hente data: " + e.message;
                el.style.display = "block";
            }
        }

        document.querySelectorAll(".period-buttons button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".period-buttons button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filterAndRender(btn.dataset.days === "ytd" ? "ytd" : Number.parseInt(btn.dataset.days, 10));
            });
        });

        document.getElementById("benchmarkToggle").addEventListener("click", function () {
            showBenchmark = !showBenchmark;
            this.textContent = showBenchmark ? "Til" : "Fra";
            this.classList.toggle("active", showBenchmark);
            filterAndRender(currentDays);
        });

        document.getElementById("trendToggle").addEventListener("click", function () {
            showTrend = !showTrend;
            this.textContent = showTrend ? "Til" : "Fra";
            this.classList.toggle("active", showTrend);
            filterAndRender(currentDays);
        });

        document.getElementById("benchmarkSelect").addEventListener("change", () => {
            filterAndRender(currentDays);
        });

        function initBenchmarkDropdown() {
            const select = document.getElementById("benchmarkSelect");
            const dropdown = document.getElementById("benchmarkDropdown");
            const trigger = document.getElementById("benchmarkDropdownBtn");
            const text = document.getElementById("benchmarkDropdownText");
            const panel = document.getElementById("benchmarkListbox");

            function renderItems() {
                panel.innerHTML = "";
                Array.from(select.options).forEach(opt => {
                    const selected = opt.value === select.value;
                    const item = document.createElement("div");
                    item.className = "kirby-dropdown-item" + (selected ? " selected" : "");
                    item.setAttribute("role", "option");
                    item.setAttribute("aria-selected", selected ? "true" : "false");

                    const label = document.createElement("span");
                    label.textContent = opt.textContent;
                    item.appendChild(label);

                    if (selected) {
                        const check = document.createElement("span");
                        check.className = "check";
                        check.textContent = "✓";
                        item.appendChild(check);
                    }

                    item.addEventListener("click", () => {
                        select.value = opt.value;
                        select.dispatchEvent(new Event("change"));
                        text.textContent = opt.textContent;
                        closePanel();
                        renderItems();
                    });

                    panel.appendChild(item);
                });
            }

            function openPanel() {
                dropdown.classList.add("open");
                trigger.setAttribute("aria-expanded", "true");
                panel.hidden = false;
            }

            function closePanel() {
                dropdown.classList.remove("open");
                trigger.setAttribute("aria-expanded", "false");
                panel.hidden = true;
            }

            trigger.addEventListener("click", () => {
                dropdown.classList.contains("open") ? closePanel() : openPanel();
            });

            document.addEventListener("click", e => {
                if (!dropdown.contains(e.target)) closePanel();
            });

            document.addEventListener("keydown", e => {
                if (e.key === "Escape") closePanel();
            });

            text.textContent = select.options[select.selectedIndex].textContent;
            renderItems();
        }

        initBenchmarkDropdown();
        init();
    </script>
</body>
</html>
